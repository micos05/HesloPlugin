name: Build Heslo Plugin
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Estrai SDK X-Plane
        shell: pwsh
        run: |
          Expand-Archive -Path XPSDK401.zip -DestinationPath XPSDK401 -Force
          
      - name: Configura e Compila
        shell: bash
        run: |
          cmake -B build -DXPLANE_SDK_PATH="${{ github.workspace }}/XPSDK401"
          cmake --build build --config Release
          
      - name: Salva il Plugin Finito
        uses: actions/upload-artifact@v4
        with:
          name: Plugin_Finito
          path: build/Release/win.xpl
